name: Build Static Binaries
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  build-linux-amd64:
    name: Build Linux amd64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y yasm autoconf automake autogen
      - name: Build
        run: make
      - name: Smoke test
        run: |
          bin/pdftilecut -tile-size A5 -in c-deps/qpdf/qpdf/qtest/qpdf/minimal.pdf -out /tmp/out.pdf
          bin/pdftilecut -tile-size A5 -no-outer-marks -in c-deps/qpdf/qpdf/qtest/qpdf/minimal.pdf -out /tmp/out2.pdf
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - uses: actions/upload-artifact@v7
        with:
          name: pdftilecut-linux-amd64
          path: bin/pdftilecut
          if-no-files-found: error
